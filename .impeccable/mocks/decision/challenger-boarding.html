<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Semi+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#F2F2EE;color:#141414;font-family:'Barlow',system-ui,sans-serif}
.pass{margin:12px;background:#fff;border-radius:8px;display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid #141414}
.pass div{padding:8px 10px;border-right:1px dashed #141414}.pass div:last-child{border-right:0}
.pass small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#555}
.pass b{font-family:'Barlow Semi Condensed',sans-serif;font-size:20px;font-variant-numeric:tabular-nums}
.status{margin:0 12px;height:34px;background:#FFB000;display:flex;align-items:center;padding:0 10px;font-weight:700;font-size:14px;border-radius:4px}
.plate{margin:12px;height:316px;background:#fff;border:1px solid #141414;border-radius:8px}
.txt{margin:6px 16px 0;font-size:17px;line-height:1.45}
.q{margin:14px 12px 0}
.q h3{font-size:17px;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row button{height:46px;border:1px solid #141414;background:#fff;border-radius:6px;font:inherit;font-weight:600}
.bar{position:absolute;bottom:0;left:0;right:0;height:74px;padding:13px 12px;display:flex;gap:10px;background:#141414}
.bar button{height:48px;border-radius:6px;font:inherit;font-weight:700;font-size:16px}
.bar .b{width:90px;background:transparent;color:#fff;border:1px solid #fff}.bar .n{flex:1;background:#FFB000;border:0}
</style></head><body>
<div class="pass"><div><small>Ticket</small><b>BB-0001</b></div><div><small>Store</small><b>Camden</b></div><div><small>Objective</small><b>1.1</b></div></div>
<div class="status">Status changed · Printer offline</div>
<div class="plate"><svg width="364" height="314" viewBox="0 0 364 314" fill="none" stroke="#141414" stroke-width="1"><g transform="translate(92,36)">
<path d="M90 0 L180 40 L90 80 L0 40 Z"/><path d="M0 40 v18 l90 40 l90 -40 v-18"/>
<g transform="translate(0,40)"><path d="M0 40 v18 l90 40 l90 -40 v-18"/></g><g transform="translate(0,80)"><path d="M0 40 v18 l90 40 l90 -40 v-18"/></g>
<g transform="translate(0,120)"><path d="M0 40 v18 l90 40 l90 -40 v-18"/></g><g transform="translate(0,160)"><path d="M0 40 v18 l90 40 l90 -40 v-18" stroke="#FFB000" stroke-width="3"/></g></g></svg></div>
<p class="txt">Bits leave the till as pulses on a cable. Pull the cable and nothing above it can talk.</p>
<div class="q"><h3>Which layer fails first?</h3><div class="row"><button>Physical</button><button>Network</button><button>App</button></div></div>
<div class="bar"><button class="b">Back</button><button class="n">Check answer</button></div>
</body></html>
