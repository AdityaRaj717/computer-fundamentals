<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Spectral+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#F3F4EF;color:#1B1D1A;font-family:'Atkinson Hyperlegible',system-ui,sans-serif}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #1B1D1A}
.tk{font-family:'Spectral SC',serif;font-size:15px;letter-spacing:.04em}
.tk b{font-weight:600}
.step{font-size:13px;font-variant-numeric:tabular-nums}
.x{width:28px;height:28px;border:1px solid #1B1D1A;border-radius:50%;display:grid;place-items:center;font-size:14px}
.plate{position:relative;margin:16px 16px 0;height:330px;padding:12px;background:#FBFBF8;border:1px solid #1B1D1A}
.plate svg{width:100%;height:100%}
.plate .no{position:absolute;left:16px;top:14px;font-family:'Spectral SC',serif;font-size:13px}
.tabs{position:absolute;right:-1px;top:24px;display:flex;flex-direction:column;gap:2px}
.tabs span{width:14px;height:30px;display:block}
.mark{position:absolute;font-size:12px;display:flex;align-items:center;gap:6px;margin-left:4px}
.opts button,.back{padding:0 12px}
.mark i{font-style:normal;width:18px;height:18px;border-radius:50%;border:1px solid #1B1D1A;display:grid;place-items:center;font-size:11px;background:#F3F4EF}
.acct{margin:14px 16px 0}
.acct h2{font-family:'Spectral SC',serif;font-weight:600;font-size:22px;letter-spacing:.02em}
.acct p{font-size:16px;line-height:1.45;margin-top:6px}
.q{margin:16px 16px 0;border-top:1px solid #1B1D1A;padding-top:12px}
.q .lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.q h3{font-size:17px;margin:6px 0 10px}
.opts{display:flex;gap:8px}
.opts button{flex:1;height:44px;border:1px solid #1B1D1A;background:#FBFBF8;font:inherit;font-size:15px;border-radius:4px}
.bar{position:absolute;left:0;right:0;bottom:0;height:72px;display:flex;gap:10px;padding:12px 16px;border-top:1px solid #1B1D1A;background:#F3F4EF}
.bar button{height:48px;font:inherit;font-size:16px;border-radius:4px}
.back{width:96px;border:1px solid #1B1D1A;background:transparent}
.next{flex:1;border:0;background:#2F5D3A;color:#fff;font-weight:700}
</style></head><body>
<div class="top"><div class="tk"><b>Ticket 01</b> · the till can't print</div><div class="step">Step 4 of 9</div><div class="x">✕</div></div>
<div class="plate">
 <div class="no">Plate 1 · The layer stack</div>
 <div class="tabs"><span style="background:#A9472A"></span><span style="background:#C68A25"></span><span style="background:#2F5D3A"></span><span style="background:#3A5A8A"></span><span style="background:#6B3E6E"></span><span style="background:#2E7C7A"></span><span style="background:#4A4A4A"></span></div>
 <svg width="356" height="328" viewBox="0 0 356 328" fill="none" stroke="#1B1D1A" stroke-width="1">
  <g transform="translate(70,40)">
   <path d="M90 0 L180 40 L90 80 L0 40 Z"/><path d="M0 40 v18 l90 40 l90 -40 v-18"/><path d="M90 80 v18"/>
   <g transform="translate(0,34)"><path d="M0 40 v18 l90 40 l90 -40 v-18" /></g>
   <g transform="translate(0,68)"><path d="M0 40 v18 l90 40 l90 -40 v-18" /></g>
   <g transform="translate(0,102)"><path d="M0 40 v18 l90 40 l90 -40 v-18" /></g>
   <g transform="translate(0,136)"><path d="M0 40 v18 l90 40 l90 -40 v-18" /></g>
   <g transform="translate(0,170)"><path d="M0 40 v18 l90 40 l90 -40 v-18" stroke="#A9472A" stroke-width="2"/></g>
   <path d="M180 248 l40 18 M228 270 l14 6" stroke="#A9472A" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
 </svg>
 <div class="mark" style="left:14px;top:92px"><i>1</i>Application</div>
 <div class="mark" style="left:14px;top:160px"><i>2</i>Network</div>
 <div class="mark" style="left:14px;top:262px"><i>3</i>Physical · cable out</div>
</div>
<div class="acct"><h2>Physical layer</h2><p>Bits leave as pulses on a cable. No cable, no pulses, and every layer above waits.</p></div>
<div class="q"><div class="lab">Predict</div><h3>The cable is unplugged. Which layer fails first?</h3>
<div class="opts"><button>Physical</button><button>Network</button><button>Application</button></div></div>
<div class="bar"><button class="back">Back</button><button class="next">Check answer</button></div>
</body></html>
