<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#fff;color:#121212;font-family:'Archivo',system-ui,sans-serif}
.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.top small{font-size:13px;color:#6B6B6B}
.num{margin:4px 16px 0;font-weight:900;font-size:120px;line-height:.85;letter-spacing:-.04em}
.num span{font-size:20px;font-weight:600;letter-spacing:0;vertical-align:top;margin-left:6px;color:#6B6B6B}
.frame{margin:14px 16px 0;height:330px;border:2px solid #121212;position:relative}
.frame .ar{position:absolute;right:12px;top:12px;background:#F2C200;padding:4px 8px;font-weight:600;font-size:13px}
.txt{margin:16px 16px 0;font-size:18px;line-height:1.4}
.opts{margin:18px 16px 0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.opts button{height:48px;border:2px solid #121212;background:#fff;font:inherit;font-weight:600}
.bar{position:absolute;bottom:0;left:0;right:0;height:76px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.bar .dots{display:flex;gap:6px}.bar .dots i{width:8px;height:8px;background:#ddd;display:block}.bar .dots i.on{background:#121212}
.bar button{height:48px;padding:0 26px;background:#121212;color:#fff;border:0;font:inherit;font-weight:600;font-size:16px}
</style></head><body>
<div class="top"><b>Ticket 01</b><small>The till can't print</small><span>✕</span></div>
<div class="num">4<span>/ 9</span></div>
<div class="frame"><div class="ar">Cable out</div>
<svg width="352" height="326" viewBox="0 0 352 326" fill="none" stroke="#121212" stroke-width="1.5"><g transform="translate(86,50)">
<path d="M90 0 L180 40 L90 80 L0 40 Z"/><path d="M0 40 v18 l90 40 l90 -40 v-18"/>
<g transform="translate(0,40)"><path d="M0 40 v18 l90 40 l90 -40 v-18"/></g><g transform="translate(0,80)"><path d="M0 40 v18 l90 40 l90 -40 v-18"/></g>
<g transform="translate(0,120)"><path d="M0 40 v18 l90 40 l90 -40 v-18"/></g><g transform="translate(0,160)"><path d="M0 40 v18 l90 40 l90 -40 v-18" stroke="#F2C200" stroke-width="4"/></g>
</g></svg></div>
<p class="txt">The cable is out. Which layer stops first?</p>
<div class="opts"><button>Physical</button><button>Network</button><button>App</button></div>
<div class="bar"><div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div><button>Check →</button></div>
</body></html>
