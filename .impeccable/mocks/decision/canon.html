<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#fff;color:#111827;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px}
.prog{flex:1;height:8px;background:#E5E7EB;border-radius:4px;overflow:hidden}.prog i{display:block;width:44%;height:100%;background:#2563EB}
.card{margin:8px 16px 0;height:320px;border-radius:16px;background:#F9FAFB;border:1px solid #E5E7EB}
h2{margin:20px 16px 0;font-size:22px}p{margin:8px 16px 0;font-size:16px;line-height:1.5;color:#374151}
.opts{margin:20px 16px 0;display:flex;flex-direction:column;gap:10px}
.opts button{height:52px;border-radius:12px;border:1.5px solid #E5E7EB;background:#fff;font:inherit;font-size:16px;text-align:left;padding:0 16px}
.cta{position:absolute;left:16px;right:16px;bottom:20px;height:54px;border-radius:12px;background:#2563EB;color:#fff;border:0;font:inherit;font-size:17px;font-weight:600}
</style></head><body>
<div class="top"><span>✕</span><div class="prog"><i></i></div><span>4/9</span></div>
<div class="card"><svg width="358" height="318" viewBox="0 0 358 318" fill="none" stroke="#111827" stroke-width="1"><g transform="translate(88,40)">
<path d="M90 0 L180 40 L90 80 L0 40 Z"/><path d="M0 40 v18 l90 40 l90 -40 v-18"/>
<g transform="translate(0,40)"><path d="M0 40 v18 l90 40 l90 -40 v-18"/></g><g transform="translate(0,80)"><path d="M0 40 v18 l90 40 l90 -40 v-18"/></g>
<g transform="translate(0,120)"><path d="M0 40 v18 l90 40 l90 -40 v-18"/></g><g transform="translate(0,160)"><path d="M0 40 v18 l90 40 l90 -40 v-18" stroke="#2563EB" stroke-width="2.5"/></g></g></svg></div>
<h2>The physical layer</h2><p>Bits travel as pulses on a cable. If the cable is out, nothing above it works.</p>
<div class="opts"><button>Physical</button><button>Network</button><button>Application</button></div>
<button class="cta">Check</button>
</body></html>
