<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F3EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11110F" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Learn Network+ by fixing a café's network: interactive figures you predict, break and fix." />
    <title>Network+ pilot · Your first week</title>
    <script>
      // Apply the saved theme before the first paint, so dark mode never flashes light.
      try {
        var s = JSON.parse(localStorage.getItem("netplus.v1") || "{}").settings || {};
        var dark = s.theme === "dark" || (s.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
